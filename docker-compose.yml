# Base stack per docs/00-architecture.md section 3.
# Only the frontend publishes a port (bound to 127.0.0.1 by default).
# Copy .env.example to .env and set POSTGRES_PASSWORD before starting.

# Thresholds for reports and alerts (backend/app/tuning.py). Empty means the built-in default;
# set TUNE_<NAME> in the .env file and restart to change one (no rebuild).
x-tuning: &tuning
  TUNE_BUDGET_NEAR: ${TUNE_BUDGET_NEAR:-}
  TUNE_TRAILING_DAYS: ${TUNE_TRAILING_DAYS:-}
  TUNE_DROP_POINTS: ${TUNE_DROP_POINTS:-}
  TUNE_DROP_BASELINE: ${TUNE_DROP_BASELINE:-}
  TUNE_DROP_MIN_BEFORE: ${TUNE_DROP_MIN_BEFORE:-}
  TUNE_IDLE_NO_INTEREST_DAYS: ${TUNE_IDLE_NO_INTEREST_DAYS:-}
  TUNE_IDLE_WINDOW_DAYS: ${TUNE_IDLE_WINDOW_DAYS:-}
  TUNE_IDLE_MIN_BALANCE: ${TUNE_IDLE_MIN_BALANCE:-}
  TUNE_PROJECTION_MONTHS: ${TUNE_PROJECTION_MONTHS:-}
  TUNE_TREND_MONTHS: ${TUNE_TREND_MONTHS:-}
  TUNE_TAX_WINDOW_DAYS: ${TUNE_TAX_WINDOW_DAYS:-}
  TUNE_MIN_ASSUMED_DAYS: ${TUNE_MIN_ASSUMED_DAYS:-}
  TUNE_MIN_SAME_MONTH_DAYS: ${TUNE_MIN_SAME_MONTH_DAYS:-}
  TUNE_NEAR_BEFORE_DAYS: ${TUNE_NEAR_BEFORE_DAYS:-}
  TUNE_NEAR_AFTER_DAYS: ${TUNE_NEAR_AFTER_DAYS:-}
  TUNE_STALE_DAYS: ${TUNE_STALE_DAYS:-}
  TUNE_RECURRING_AMOUNT_TOLERANCE: ${TUNE_RECURRING_AMOUNT_TOLERANCE:-}
  TUNE_RECURRING_SHARE: ${TUNE_RECURRING_SHARE:-}
  TUNE_TRANSFER_WINDOW_DAYS: ${TUNE_TRANSFER_WINDOW_DAYS:-}
  TUNE_FLAG_MIN_PEERS: ${TUNE_FLAG_MIN_PEERS:-}
  TUNE_FLAG_LARGE_TIMES: ${TUNE_FLAG_LARGE_TIMES:-}
  TUNE_FLAG_MIN_PAYMENTS_FOR_NEW_PAYEE: ${TUNE_FLAG_MIN_PAYMENTS_FOR_NEW_PAYEE:-}
  TUNE_FLAG_NEW_PAYEE_TIMES: ${TUNE_FLAG_NEW_PAYEE_TIMES:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lanka
      POSTGRES_DB: lanka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanka -d lanka"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    networks: [internal]
    mem_limit: 5g
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot job: asks the ollama server to download the configured model, then exits.
  # Run on demand: docker compose --profile setup run --rm ollama-pull
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["setup"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:1.5b}"]
    networks: [internal]
    restart: "no"

  backend:
    build: ./backend
    environment:
      <<: *tuning
      DATABASE_URL: postgresql+psycopg://lanka:${POSTGRES_PASSWORD}@postgres:5432/lanka
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-60}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      EMBED_SUGGEST_ENABLED: ${EMBED_SUGGEST_ENABLED:-false}
      EMBED_MIN_SIMILARITY: ${EMBED_MIN_SIMILARITY:-0.80}
      EMBED_MIN_AGREE: ${EMBED_MIN_AGREE:-0.80}
      EMBED_K: ${EMBED_K:-5}
      EMBED_MIN_NEIGHBOURS: ${EMBED_MIN_NEIGHBOURS:-2}
      EMBED_TASK: ${EMBED_TASK:-classification}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DOCUMENTS_DIR: /data/documents
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_PAGES: ${MAX_PAGES:-300}
      RETAIN_DOCUMENTS: ${RETAIN_DOCUMENTS:-false}
      LLM_CLASSIFY_ENABLED: ${LLM_CLASSIFY_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - documents:/data/documents
    networks: [internal]
    mem_limit: 1g
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Background worker: same image as the backend, no published ports.
  # Starts after the backend is healthy so database migrations have been applied.
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *tuning
      DATABASE_URL: postgresql+psycopg://lanka:${POSTGRES_PASSWORD}@postgres:5432/lanka
      DOCUMENTS_DIR: /data/documents
      MAX_PAGES: ${MAX_PAGES:-300}
      RETAIN_DOCUMENTS: ${RETAIN_DOCUMENTS:-false}
      JOB_TIMEOUT_S: ${JOB_TIMEOUT_S:-120}
      JOB_POLL_S: ${JOB_POLL_S:-2}
      # Local model for the AI categorisation pass (reached over the internal network only).
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_S: ${LLM_TIMEOUT_S:-120}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      EMBED_SUGGEST_ENABLED: ${EMBED_SUGGEST_ENABLED:-false}
      EMBED_MIN_SIMILARITY: ${EMBED_MIN_SIMILARITY:-0.80}
      EMBED_MIN_AGREE: ${EMBED_MIN_AGREE:-0.80}
      EMBED_K: ${EMBED_K:-5}
      EMBED_MIN_NEIGHBOURS: ${EMBED_MIN_NEIGHBOURS:-2}
      EMBED_TASK: ${EMBED_TASK:-classification}
      LLM_CLASSIFY_ENABLED: ${LLM_CLASSIFY_ENABLED:-true}
      LLM_CONFIDENCE_THRESHOLD: ${LLM_CONFIDENCE_THRESHOLD:-0.8}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - documents:/data/documents
    networks: [internal]
    mem_limit: 2g
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    restart: unless-stopped
    # Alive while the worker keeps touching its heartbeat file (see app/worker.py).
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker-heartbeat')<60 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge, internal]
    mem_limit: 512m
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  edge: {}
  internal: {}

volumes:
  pgdata:
  ollama_models:
  documents:
