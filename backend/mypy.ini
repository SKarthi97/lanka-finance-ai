# Type checking. Advisory for now: CI runs `mypy app` without failing the build until the first clean
# run. Start lenient (untyped functions are skipped), then turn on check_untyped_defs and fix.
[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = True
no_implicit_optional = True
exclude = (alembic/versions|venv|tests)/
plugins = pydantic.mypy
