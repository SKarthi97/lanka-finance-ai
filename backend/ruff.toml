# Ruff: a fast linter. Start small (syntax errors and pyflakes: unused imports and names,
# undefined names) and widen later. `ruff check --fix` removes unused imports.
target-version = "py312"
line-length = 120
extend-exclude = ["alembic/versions", "venv"]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]  # short lambdas used as test helpers
