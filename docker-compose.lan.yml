# Reach the app from another device on your home network, over HTTPS.
#   .\scripts\lan.ps1            (sets the address, starts this, exports the certificate to install)
#
# The browser talks to a small Caddy proxy on port 8443, which passes requests to the frontend.
# The frontend itself stays on 127.0.0.1, and the session cookie becomes HTTPS-only (Secure).
# Needs: LAN_HOST (this computer's address, e.g. 192.168.1.20) and LAN_NAME (a different name for
# it, e.g. mypc.local). scripts/lan.ps1 fills both in.

services:
  lan-proxy:
    image: caddy:2.8-alpine
    environment:
      LAN_HOST: ${LAN_HOST:?run scripts/lan.ps1, or set LAN_HOST to this computer's address}
      LAN_NAME: ${LAN_NAME:?run scripts/lan.ps1, or set LAN_NAME to a name for this computer}
    volumes:
      - ./lan/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${LAN_BIND:-0.0.0.0}:${LAN_PORT:-8443}:8443"
    depends_on:
      frontend:
        condition: service_healthy
    networks: [edge]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # the caddy binary carries this file capability; without it the container cannot start
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    environment:
      COOKIE_SECURE: "true"

volumes:
  caddy_data:
  caddy_config:
